name: CLA Bot

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run CLA bot
        uses: rajnishtiwari7/cla-bot@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          signatures-owner: rajnishtiwari7
          signatures-repo: cla-signatures
          signatures-path: signatures/cla.json
          cla-document-url: https://github.com/rajnishtiwari7/cla-signatures/blob/main/CLA.md
          app-id: ${{ secrets.CLA_APP_ID }}
          app-private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          allowlist: |
            41898282
            49699333
            29139614
